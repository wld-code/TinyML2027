<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 197" role="img" aria-labelledby="title"><title id="title">Cycle de vie du modèle</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#375a70"/></marker></defs><rect width="960" height="100%" fill="#f8fafc"/>
<text x="24" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="#17334b">Cycle de vie du modèle</text>
<path d="M229 96H260" fill="none" stroke="#375a70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M465 96H496" fill="none" stroke="#375a70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M701 96H732" fill="none" stroke="#375a70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M835 127V175H126V127" fill="none" stroke="#375a70" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="165" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#17334b">Les erreurs observées orientent le prochain correctif</text>
<rect x="24" y="65" width="205" height="62" rx="7" fill="#e6eff5" stroke="#7797aa"/>
<text x="126.5" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17334b">Versionner les données</text>
<text x="126.5" y="111" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17334b">Référence puis correctif</text>
<rect x="260" y="65" width="205" height="62" rx="7" fill="#e6eff5" stroke="#7797aa"/>
<text x="362.5" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17334b">Entraîner et évaluer</text>
<text x="362.5" y="111" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17334b">Même jeu de promotion</text>
<rect x="496" y="65" width="205" height="62" rx="7" fill="#e6eff5" stroke="#7797aa"/>
<text x="598.5" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17334b">Décider</text>
<text x="598.5" y="111" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17334b">Critères et qualification</text>
<rect x="732" y="65" width="205" height="62" rx="7" fill="#e6eff5" stroke="#7797aa"/>
<text x="834.5" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17334b">Déployer et observer</text>
<text x="834.5" y="111" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17334b">USB et journaux locaux</text>
